  Панель редактирования Decap CMS (бывший Netlify CMS, назван в ТЗ).

  Скрипт стоит в конце <body>, а не в <head>: он сразу монтирует себя в
  document.body, и из <head> падал с «Cannot read properties of null
  (reading 'appendChild')» — тело страницы к тому моменту ещё не разобрано.

  Локальная проверка без GitHub: запустить `npx decap-server` рядом с
  `npm run dev`, в config.yml уже стоит local_backend: true. Боевой режим
  требует настоящего репозитория и OAuth-посредника — см. шапку config.yml.
-->
