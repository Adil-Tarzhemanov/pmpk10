# ============================================================
# Decap CMS — панель редактирования сайта ПМПК № 10
#
# Decap — это переименованный Netlify CMS, который прямо назван в ТЗ.
# У неё git-бэкенд: редактор правит текст в браузере, CMS коммитит
# изменения в репозиторий, а хостинг пересобирает сайт. Базы данных и
# серверной админки нет — нечего ломать и нечего хостить отдельно.
#
# ЧТО ОСТАЛОСЬ СДЕЛАТЬ ДЛЯ ЗАПУСКА (второй этап по ТЗ):
#   1. [сделано] Репозиторий указан ниже.
#   2. Поднять OAuth-посредника для GitHub и вписать его адрес в base_url —
#      без него CMS не сможет авторизовать редактора. На Vercel это готовый
#      шаблон в одну кнопку.
#   3. Завести заказчице учётную запись с доступом на запись в репозиторий.
# ============================================================

# Локальный режим для проверки панели без GitHub: Decap включает его
# только когда сайт открыт с localhost, на боевом домене он игнорируется.
# Запуск: npx decap-server рядом с npm run dev
local_backend: true

backend:
  name: github
  repo: Adil-Tarzhemanov/pmpk10
  branch: main
  # base_url: https://<адрес-oauth-посредника>

# Черновики попадают в pull request, а не сразу на сайт:
# у заказчицы остаётся возможность передумать до публикации
publish_mode: editorial_workflow

# Картинки, которые загружает редактор
media_folder: public/uploads
public_folder: /uploads

locale: ru

collections:
  # ---------------------------------------------------------- Новости
  - name: news_ru
    label: Новости (рус)
    folder: content/news/ru
    create: true
    format: json
    slug: "{{slug}}"
    summary: "{{dateLabel}} — {{title}}"
    sortable_fields: [date]
    fields:
      - { name: date, label: Дата, widget: datetime, format: YYYY-MM-DD, time_format: false }
      - { name: dateLabel, label: Дата прописью, widget: string, hint: "Например: 12 августа 2026" }
      - { name: title, label: Заголовок, widget: string }
      - { name: summary, label: Краткое описание, widget: text, hint: "Показывается в карточке на главной" }
      - { name: image, label: Фотография, widget: image, required: false, hint: "Необязательно. Без неё карточка получит узор в фирменных цветах" }
      - { name: body, label: Текст новости, widget: list, field: { name: paragraph, label: Абзац, widget: text } }

  - name: news_kk
    label: Жаңалықтар (қаз)
    folder: content/news/kk
    create: true
    format: json
    slug: "{{slug}}"
    summary: "{{dateLabel}} — {{title}}"
    sortable_fields: [date]
    fields:
      - { name: date, label: Күні, widget: datetime, format: YYYY-MM-DD, time_format: false }
      - { name: dateLabel, label: Күні жазбаша, widget: string, hint: "Мысалы: 12 тамыз 2026" }
      - { name: title, label: Тақырып, widget: string }
      - { name: summary, label: Қысқаша сипаттама, widget: text }
      - { name: image, label: Фотосурет, widget: image, required: false }
      - { name: body, label: Жаңалық мәтіні, widget: list, field: { name: paragraph, label: Абзац, widget: text } }

  # ВАЖНО: имя файла (slug) русской и казахской версии одной новости
  # должно совпадать — иначе переключатель языка на странице новости
  # уведёт в никуда.

  # ------------------------------------------------- Разделы и реквизиты
  - name: pages
    label: Разделы сайта
    files:
      - name: home_ru
        label: Главная страница (рус)
        file: content/pages/home.ru.json
        format: json
        description: >-
          Первый экран, запись на приём, инструкция, список документов и
          направления работы. Самая посещаемая страница сайта.
        fields:
          - name: hero
            label: Первый экран
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: Надзаголовок, widget: string }
              - { name: title, label: Заголовок, widget: text }
              - { name: lede, label: Вводный абзац, widget: text }
              - name: facts
                label: Цифры справа под карточкой
                widget: list
                fields:
                  - { name: value, label: Значение, widget: string, hint: "Например: 0–18" }
                  - { name: label, label: Подпись, widget: string }
          - name: booking
            label: Карточка записи на приём
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: Надзаголовок, widget: string }
              - { name: title, label: Заголовок, widget: string }
              - { name: when, label: Текст до выделения, widget: string }
              - { name: whenStrong, label: Выделенное жирным, widget: string, hint: "Даты и время открытия записи" }
              - { name: whenTail, label: Текст после выделения, widget: string }
              - { name: cta, label: Главная кнопка, widget: string }
              - { name: howCta, label: Кнопка «как записаться», widget: string }
              - { name: docsCta, label: Кнопка «какие документы», widget: string }
              - { name: note, label: Приписка мелким шрифтом, widget: text }
          - name: online
            label: Инструкция по онлайн-записи
            widget: object
            collapsed: true
            fields:
              - { name: eyebrow, label: Надзаголовок, widget: string }
              - { name: title, label: Заголовок, widget: text }
              - { name: lede, label: Вводный абзац, widget: text }
              - { name: phoneNote, label: Подпись над телефоном, widget: string }
              - { name: moreCta, label: Кнопка под инструкцией, widget: string }
              - name: steps
                label: Шаги
                widget: list
                field: { name: step, label: Шаг, widget: text }
          - name: steps
            label: Порядок обращения
